[tox]
isolated_build = true
envlist =
    py{39,310,311,312,313,314,315}
    pypy3
    py314-bare

[testenv]
# The CLDR data is imported by `commands`, so isn't there yet when packaging
package = editable
dependency_groups =
    !bare: dev
    # The bare environment runs the tests without optional dependencies (pytz, jinja2, setuptools)
    bare: test
deps =
    # On Python 3.9, we need a version of Setuptools that still has pkg_resources
    # to be able to run the Jinja extractor tests.
    py39: setuptools<82
    {env:BABEL_TOX_EXTRA_DEPS:}
allowlist_externals = make
commands = make clean-cldr test
setenv =
    PYTEST_FLAGS=--cov=babel --cov-report=xml:{env:COVERAGE_XML_PATH:.coverage_cache}/coverage.{envname}.xml
    BABEL_TOX_INI_DIR={toxinidir}
passenv =
    BABEL_*
    PYTEST_*
    PYTHON_*
    # To let pytest-github-actions-annotate-failures know it's running in GitHub Actions:
    GITHUB_ACTIONS

[gh-actions]
python =
    pypy3: pypy3
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
